name: 问题反馈
description: 记录操作异常、卡顿或界面问题
title: '[问题] '
body:
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 7.0.0 正式版
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机型号与 Android 版本
  - type: textarea
    id: steps
    attributes:
      label: 怎样出现的
      description: 请描述操作步骤、原本期望与实际结果；界面问题可以附截图或录屏。请遮住个人记录。
    validations:
      required: true
